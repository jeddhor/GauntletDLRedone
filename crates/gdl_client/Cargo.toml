[package]
name = "gdl_client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy.workspace = true
gdl_core = { path = "../gdl_core" }
gdl_formats = { path = "../gdl_formats" }
